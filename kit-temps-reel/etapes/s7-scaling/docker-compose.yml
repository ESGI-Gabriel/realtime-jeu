# Lancer depuis la racine du kit :
#   docker compose -f etapes/s7-scaling/docker-compose.yml up --build
name: kit-s7-scaling

services:
  redis:
    image: redis:7-alpine

  app-a:
    build:
      context: ../..
      dockerfile: etapes/s7-scaling/Dockerfile
    environment:
      INSTANCE: A
      REDIS_URL: redis://redis:6379
      PORT: "9001"
    depends_on: [redis]

  app-b:
    build:
      context: ../..
      dockerfile: etapes/s7-scaling/Dockerfile
    environment:
      INSTANCE: B
      REDIS_URL: redis://redis:6379
      PORT: "9001"
    depends_on: [redis]

  proxy:
    image: nginx:alpine
    ports:
      - "9001:9001"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app-a, app-b]
